<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Autorización · Hali</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#111; --sub:#555; --card:#fafafa; --border:#e5e5e5; --accent:#e11d48; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f0f11; --fg:#f5f5f5; --sub:#a1a1aa; --card:#18181b; --border:#27272a; --accent:#fb7185; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; line-height:1.6; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 20px 80px; }
  header { text-align:center; padding: 8px 0 4px; }
  h1 { font-size: 24px; font-weight: 800; letter-spacing:-0.5px; margin: 8px 0; }
  .sub { color: var(--sub); font-size: 15px; text-align:center; margin: 4px 0 28px; }
  section { background: var(--card); border:1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 14px; }
  h2 { font-size: 16px; font-weight: 700; margin: 0 0 8px; }
  p { margin: 0; color: var(--sub); font-size: 15px; }
  .label { font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--sub); margin-bottom:8px; }
  .code-box { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:15px; line-height:1.5; word-break:break-all; user-select:all; -webkit-user-select:all; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:14px; color:var(--fg); }
  .btn { background:var(--accent); color:#fff; border:none; padding:12px 18px; border-radius:10px; font-weight:700; font-size:15px; cursor:pointer; font-family:inherit; }
  .btn:active { opacity:.85; }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:14px; }
  .ok { color: var(--accent); font-weight:700; font-size:14px; }
  .err h2 { color: var(--accent); }
  footer { text-align:center; color:var(--sub); font-size:13px; margin-top:36px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Autorización de TikTok</h1>
  </header>
  <p class="sub">Paso intermedio del flujo de autorización. Nada se envía ni se guarda.</p>
  <div id="content"></div>
  <footer>Hali · haliworld.com</footer>
</div>
<script>
// Todo corre en el cliente. El code NO se envía a ningún servidor, no se loguea,
// no se guarda en localStorage ni en cookies. Solo se muestra en pantalla para
// copiarlo a mano. Es una credencial de un solo uso.
(function () {
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var state = params.get('state');
  var error = params.get('error');
  var errorDescription = params.get('error_description');
  var root = document.getElementById('content');

  // Helper mínimo. Los valores de la query string SIEMPRE van por textContent,
  // nunca por innerHTML, para que no haya forma de inyectar markup desde la URL.
  function el(tag, opts) {
    var n = document.createElement(tag);
    opts = opts || {};
    if (opts.class) n.className = opts.class;
    if (opts.text != null) n.textContent = opts.text;
    if (opts.style) n.setAttribute('style', opts.style);
    return n;
  }

  if (code) {
    var s = el('section');
    s.appendChild(el('div', { class: 'label', text: 'Authorization code' }));

    var box = el('div', { class: 'code-box' });
    box.textContent = code;
    s.appendChild(box);

    var btn = el('button', { class: 'btn', text: 'Copiar' });
    btn.type = 'button';
    var status = el('span', { class: 'ok' });
    var row = el('div', { class: 'row' });
    row.appendChild(btn);
    row.appendChild(status);
    s.appendChild(row);

    btn.addEventListener('click', function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(
          function () { status.textContent = 'Copiado ✓'; },
          function () { selectBox(); status.textContent = 'Seleccionado — Ctrl/Cmd+C'; }
        );
      } else {
        selectBox();
        status.textContent = 'Seleccionado — Ctrl/Cmd+C';
      }
    });

    function selectBox() {
      var r = document.createRange();
      r.selectNodeContents(box);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
    }

    root.appendChild(s);

    if (state) {
      var ss = el('section');
      ss.appendChild(el('div', { class: 'label', text: 'state' }));
      var sb = el('div', { class: 'code-box' });
      sb.textContent = state;
      ss.appendChild(sb);
      root.appendChild(ss);
    }

    root.appendChild(el('p', { class: 'sub', style: 'text-align:left;margin-top:4px', text: 'Copiá el código y pegalo en la terminal. Es de un solo uso.' }));

  } else if (error) {
    var esec = el('section');
    esec.className = 'err';
    esec.appendChild(el('h2', { text: 'Error de autorización' }));
    esec.appendChild(el('div', { class: 'label', text: 'error' }));
    var eb = el('div', { class: 'code-box' });
    eb.textContent = error;
    esec.appendChild(eb);
    if (errorDescription) {
      esec.appendChild(el('div', { class: 'label', style: 'margin-top:14px', text: 'error_description' }));
      var db = el('div', { class: 'code-box' });
      db.textContent = errorDescription;
      esec.appendChild(db);
    }
    root.appendChild(esec);

  } else {
    var ns = el('section');
    ns.appendChild(el('h2', { text: 'Nada que hacer acá' }));
    ns.appendChild(el('p', { text: 'Esta página es parte de un flujo de autorización de TikTok. Si llegaste sin un código de autorización, no hay ninguna acción para tomar.' }));
    root.appendChild(ns);
  }
})();
</script>
</body>
</html>
